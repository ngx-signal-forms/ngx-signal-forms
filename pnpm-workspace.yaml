packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/demo/*'
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  less: false
  lmdb: false
  msgpackr-extract: false
  msw: true
  nx: true
  simple-git-hooks: true
autoInstallPeers: true
catalogMode: 'prefer'
# pnpm defaults this to `install`, which runs an implicit `pnpm install`
# before commands such as `pnpm nx ...`. That is unsafe in git worktrees where
# `node_modules` may be symlinked to the main checkout, and CI should use the
# explicit install step instead of command-time dependency repair.
verifyDepsBeforeRun: false
# Supply-chain settings.
# Refuse a version whose publish trust is weaker than earlier versions of the
# same package, such as a provenance-signed package that suddenly publishes
# without provenance. Add `trustPolicyExclude` entries only for named cases.
trustPolicy: no-downgrade
trustPolicyExclude:
  # 9.13.x and 10.x publish with GitHub provenance; the 9.14.0 backport to the
  # 9.x line does not. Reached only through verdaccio (local release dry runs).
  - pino@9.14.0
  # The 6.x line is a 2023 backport that predates npm provenance, so it looks
  # like a downgrade next to 7.x. Reached only through @babel/core.
  - semver@6.3.1
# Transitive dependencies cannot come from git, tarball URLs or other
# non-registry sources.
blockExoticSubdeps: true
# Fail the install when a dependency with build scripts is missing from
# `allowBuilds`, instead of skipping its scripts silently.
strictDepBuilds: true
# Skip versions younger than two days (in minutes). Keep this equal to the
# Dependabot `cooldown.default-days` in .github/dependabot.yml.
minimumReleaseAge: 2880
# pnpm 12.3+ turns strict mode on whenever `minimumReleaseAge` is set. Strict
# mode refuses `pnpm update --no-save`, which is what Dependabot runs, so every
# Dependabot update fails (dependabot-core#16375). The two-day window still
# applies; strict mode only adds an approval prompt a bot cannot answer.
# Remove this once dependabot-core#16376 ships.
minimumReleaseAgeStrict: false
# pnpm 12 writes the lockfile as two YAML documents. Dependabot reads only the
# first and sees no dependencies (dependabot-core#15904). This keeps the
# lockfile to one document. It also stops pnpm from enforcing `packageManager`,
# so CI and `pnpm/action-setup` are the only pins for the pnpm version. Remove
# this once dependabot-core#15904 is fixed.
pmOnFail: ignore
