packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/demo/*'
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  less: false
  lmdb: false
  msgpackr-extract: false
  msw: true
  nx: true
  simple-git-hooks: true
autoInstallPeers: true
catalogMode: 'prefer'
# pnpm 11 defaults this to `install`, which runs an implicit `pnpm install`
# before commands such as `pnpm nx ...`. That is unsafe in git worktrees where
# `node_modules` may be symlinked to the main checkout, and CI should use the
# explicit install step instead of command-time dependency repair.
verifyDepsBeforeRun: false
catalogs:
  analogjs:
    '@analogjs/vite-plugin-angular': '2.7.1'
    '@analogjs/vitest-angular': '2.7.1'
  axe:
    '@axe-core/playwright': '^4.13.0'
    axe-core: '^4.13.0'
  angular:
    '@angular/animations': '22.1.5'
    '@angular/aria': '22.1.5'
    '@angular/cdk': '22.1.5'
    '@angular/common': 22.1.5
    '@angular/compiler': 22.1.5
    '@angular/core': 22.1.5
    '@angular/forms': 22.1.5
