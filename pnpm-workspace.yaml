strictPeerDependencies: false
# `pnpm peers check` runs in CI. tsconfck (via vite-tsconfig-paths) lists
# typescript ^5 as its peer; the workspace builds and tests on TypeScript 6
# with it. Drop this rule once tsconfck widens its range.
# @vitest/mocker lists msw ^2.4.9 as its peer; the demo mocks run on MSW 3 and
# Vitest never loads msw here. Drop this rule once @vitest/mocker accepts msw 3.
peerDependencyRules:
  allowedVersions:
    'tsconfck>typescript': '6'
    '@vitest/mocker>msw': '3'
