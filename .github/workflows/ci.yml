name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      skip_cloud:
        description: 'Skip Nx Cloud (use when cloud auth, plan, or service is failing)'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

# Cancel superseded runs on the same branch/PR - every other push/PR/tag
# workflow in this repo already does this (deploy-demo, publish, release,
# update-snapshots); ci.yml was the one gap. Saves both GH Actions minutes
# and Nx Cloud credits when a branch is pushed to repeatedly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - run: sfw pnpm install --frozen-lockfile

      # `strictPeerDependencies` is off, so peer conflicts do not fail the
      # install. This step makes them visible.
      - name: Check peer dependencies
        run: pnpm peers check

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      # The runner image ships Google's Chrome apt source. Playwright installs
      # its own browsers and only needs Ubuntu's archives for system libraries,
      # so drop the source before `install-deps` runs `apt-get update`. That
      # third-party mirror has served a mismatched package index and broken
      # every CI job that touched apt.
      - name: Drop the Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Configure Nx Cloud access
        id: nx_cloud
        env:
          NX_CLOUD_ACCESS_TOKEN_RW: ${{ secrets['NX_CLOUD_ACCESS_TOKEN_RW'] }}
          NX_CLOUD_ACCESS_TOKEN_RO: ${{ secrets['NX_CLOUD_ACCESS_TOKEN_RO'] }}
        run: |
          if [ "${{ inputs.skip_cloud }}" = "true" ]; then
            echo "NX_NO_CLOUD=true" >> "$GITHUB_ENV"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Nx Cloud disabled via workflow input."
            exit 0
          fi

          TOKEN=""

          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$NX_CLOUD_ACCESS_TOKEN_RW" ]; then
            TOKEN="$NX_CLOUD_ACCESS_TOKEN_RW"
          elif [ -n "$NX_CLOUD_ACCESS_TOKEN_RO" ]; then
            TOKEN="$NX_CLOUD_ACCESS_TOKEN_RO"
          fi

          if [ -n "$TOKEN" ]; then
            echo "NX_CLOUD_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "NX_NO_CLOUD=false" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Nx Cloud enabled."
          else
            echo "NX_NO_CLOUD=true" >> "$GITHUB_ENV"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No Nx Cloud token configured. Running without Nx Cloud."
          fi

      # Set BASE/HEAD for affected commands.
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1

      - name: Nx Report
        run: pnpm exec nx report

      - name: Check formatting
        env:
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
        run: pnpm run format:check

      # Keep the critical path focused on fast checks + smaller e2e suites.
      # The heavy demo-e2e suite is sharded in a separate parallel job.
      # Do not distribute this graph. Use non-atomized e2e targets so it can
      # run without Nx Agents.
      - name: Run affected tasks (excluding demo-e2e)
        run: pnpm exec nx affected -t lint typecheck test test-browser build e2e --exclude=demo-e2e --parallel=2 --outputStyle=static
        timeout-minutes: 10

      # Run outside affected selection so README/docs-only changes are checked.
      # The build dependency can reuse the affected build's cache.
      - name: Check README starter
        run: pnpm exec nx run toolkit:check-documentation-starter --outputStyle=static

      # Same reasoning as the README starter check above: this script is not
      # a build/lint/test target, so `nx affected` never picks it up on its
      # own. It exercises the `gh`-failure path of
      # tools/scripts/a11y-report-violations.mjs (see ADR-0013).
      - name: Check a11y report script
        run: pnpm exec nx run workspace:check-a11y-report-violations --outputStyle=static

      # Same reasoning as the checks above: this spec covers a release-time
      # script, not a build/lint/test target, so `nx affected` never picks
      # it up on its own.
      - name: Check changelog renderer
        run: pnpm exec nx run workspace:check-changelog-renderer --outputStyle=static

      # Same reasoning as the checks above: this spec covers a commitlint
      # rule, not a build/lint/test target, so `nx affected` never picks it
      # up on its own.
      - name: Check no-bare-mention rule
        run: pnpm exec nx run workspace:check-no-bare-mention --outputStyle=static

      # Same reasoning as the checks above. Building the Docs7 site fails on
      # a docs link to a missing file or anchor, so a broken link fails the
      # PR instead of shipping to the site.
      - name: Check Docs7 site build
        run: pnpm exec nx run workspace:check-docs7-site --outputStyle=static

      # Same reasoning as the README starter check above: neither is a
      # build/lint/test target, so `nx affected` never picks it up on its
      # own. Each guards a different part of the published toolkit package
      # (#514): the public `.d.ts` surface and tarball file list, and the
      # `publint` + `attw` package-shape checks. Run together via
      # `run-many` so `toolkit:build` (their shared dependency) runs
      # once for both instead of once per `nx run`.
      - name: Check published API surface, tarball contents, and package shape
        run: pnpm exec nx run-many -t check-published-package check-package-shape -p toolkit --outputStyle=static

      # Separate step: the bundle-size budget is the one guard #514 asks to
      # report as a change on the PR, not just pass/fail in the log, so this
      # also appends a Markdown table to the job summary.
      - name: Check bundle size budget
        run: |
          pnpm exec nx build toolkit --outputStyle=static
          set +e
          node packages/toolkit/scripts/size-report.mjs > "$RUNNER_TEMP/size-limit-summary.md"
          status=$?
          set -e
          cat "$RUNNER_TEMP/size-limit-summary.md"
          cat "$RUNNER_TEMP/size-limit-summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Generate lint report
        if: ${{ always() }}
        run: pnpm exec oxlint . --format=json > lint-report.json || true

      - name: Upload test and lint artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/*-e2e/playwright-report/
            dist/.playwright/apps/*-e2e/test-output/
            lint-report.json
          if-no-files-found: ignore
          retention-days: 14

      # https://nx.dev/ci/features/self-healing-ci
      # continue-on-error: fix-ci requires Nx Cloud, may fail if quota exceeded
      - run: pnpm exec nx fix-ci --outputStyle=static
        if: ${{ always() && !inputs.skip_cloud && steps.nx_cloud.outputs.enabled == 'true' && env.NX_NO_CLOUD != 'true' }}
        continue-on-error: true

  demo-e2e-sharded:
    name: Demo E2E (sharded)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard-index: [1, 2, 3, 4]
    env:
      NX_NO_CLOUD: 'true'
      NX_DAEMON: 'false'
      SHARD_TOTAL: '4'
      PLAYWRIGHT_DEMO_PORT: '4300'
      PW_WORKERS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - run: sfw pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      # The runner image ships Google's Chrome apt source. Playwright installs
      # its own browsers and only needs Ubuntu's archives for system libraries,
      # so drop the source before `install-deps` runs `apt-get update`. That
      # third-party mirror has served a mismatched package index and broken
      # every CI job that touched apt.
      - name: Drop the Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run demo-e2e shard
        env:
          SHARD_INDEX: ${{ matrix.shard-index }}
        run: pnpm exec nx run demo-e2e:e2e-ci-shard --outputStyle=static

      - name: Upload demo-e2e shard artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: demo-e2e-shard-${{ matrix.shard-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/demo-e2e/playwright-report/
            dist/.playwright/apps/demo-e2e/test-output/
          if-no-files-found: ignore
          retention-days: 14

  # Proves the published toolkit stays design-system-free as the reference
  # demo apps (#40 - Material/PrimeNG/Spartan) land. Two assertions:
  #   1. Static: toolkit's own package.json declares no design-system deps.
  #   2. Runtime: `nx build toolkit` succeeds in a workspace pruned to
  #      toolkit + its transitive deps via `pnpm install --filter`, so even
  #      if a future demo app pulls in @angular/material et al., none of
  #      those packages are present in node_modules during the toolkit build.
  toolkit-isolation:
    name: Toolkit isolation (design-system-free build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          filter: tree:0
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Assert toolkit declares no design-system deps
        run: pnpm check:toolkit-peer-deps

      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - name: Install only toolkit + its dependencies
        # `--filter "@ngx-signal-forms/toolkit..."` includes the toolkit and
        # its transitive workspace deps but excludes apps/demo* and any
        # future demo apps that depend on the toolkit. Demo design-system
        # deps therefore never enter node_modules in this job.
        run: sfw pnpm install --frozen-lockfile --filter "@ngx-signal-forms/toolkit..."

      - name: Build toolkit
        run: pnpm exec nx build toolkit

  # Enforces the merged coverage thresholds in vitest.coverage.config.mts.
  # `workspace:coverage` instruments the toolkit's jsdom + browser specs plus
  # the demo app's unit specs in one run and fails below threshold. Chromium
  # only: the browser project's single instance is chromium (see
  # packages/toolkit/vitest.browser.config.mts).
  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_NO_CLOUD: 'true'
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          filter: tree:0
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - run: sfw pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      # The runner image ships Google's Chrome apt source. Playwright installs
      # its own browsers and only needs Ubuntu's archives for system libraries,
      # so drop the source before `install-deps` runs `apt-get update`. That
      # third-party mirror has served a mismatched package index and broken
      # every CI job that touched apt.
      - name: Drop the Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run coverage
        run: pnpm exec nx run workspace:coverage --outputStyle=static

      - name: Upload coverage report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  # WCAG 2.2 AA accessibility scan of the demo apps. Runs in parallel with the
  # `main` build job (see that job above). On a pull request, a violation
  # that is not already in the app's baseline fails this job (ADR-0013) — a
  # maintainer accepts a known third-party or scaffolding violation by adding
  # it to the baseline in a reviewed diff, not by this job going green
  # anyway. The toolkit's own WCAG conformance is a hard gate in the `main`
  # job's `test-browser` task. On a push to the `main` branch this job stays
  # non-blocking end to end (job-level `continue-on-error`, unchanged from
  # before ADR-0013): it opens a GitHub issue per new violation instead of
  # failing, and a `gh` outage there cannot fail the `main` branch build.
  a11y:
    name: Accessibility (WCAG 2.2 AA demo scan)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      issues: write
    env:
      NX_NO_CLOUD: 'true'
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - run: sfw pnpm install --frozen-lockfile

      # Both engines: the scan runs in Chromium + Firefox for cross-engine
      # accessibility coverage of the last-2-versions browser policy.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-firefox-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      # The runner image ships Google's Chrome apt source. Playwright installs
      # its own browsers and only needs Ubuntu's archives for system libraries,
      # so drop the source before `install-deps` runs `apt-get update`. That
      # third-party mirror has served a mismatched package index and broken
      # every CI job that touched apt.
      - name: Drop the Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium firefox
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1

      # PRs: only the affected demo apps, for fast feedback.
      - name: Scan affected demo apps (pull request)
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm exec nx affected -t a11y --parallel=2 --outputStyle=static

      # main: every demo app, so issue creation sees the full picture.
      - name: Scan all demo apps (push)
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm exec nx run-many -t a11y --parallel=2 --outputStyle=static

      # PRs: fail the job on any violation not already in the baseline.
      - name: Report new violations (pull request)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: node tools/scripts/a11y-report-violations.mjs --check

      # main: ensure the triage labels exist, then open an issue per new
      # violation (deduped by title inside the script). The job-level
      # `continue-on-error` above already keeps this non-blocking on push.
      - name: Open issues for new violations (push)
        if: ${{ github.event_name != 'pull_request' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create a11y --color 1d76db --description "Accessibility (WCAG) issue" --force
          gh label create needs-triage --color d93f0b --description "Needs maintainer triage" --force
          node tools/scripts/a11y-report-violations.mjs --create-issues

      - name: Upload a11y artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a11y-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/.a11y/
            apps/*/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
