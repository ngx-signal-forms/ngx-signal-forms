name: Release

# Manually create versioned releases with changelog and git tags
# Publishing is intentionally handled by the separate Publish workflow.
#
# Release types:
#   - patch/minor/major: Stable releases → npm tag: latest
#   - prerelease --preid=beta: Beta releases → npm tag: beta (e.g., 1.0.0-beta.1)
#   - prerelease --preid=rc: Release candidates → npm tag: rc (e.g., 1.0.0-rc.1)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type or exact version'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
          - custom
      custom_version:
        description: 'Custom version (only if "custom" is selected)'
        required: false
        type: string
      prerelease_id:
        description: 'Prerelease identifier (for pre* versions)'
        required: false
        type: choice
        default: 'beta'
        options:
          - beta
          - rc
          - alpha
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false
      first_release:
        description: 'Treat as first Nx-managed release (uses --first-release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The quality gate runs every affected e2e suite in this one job, including
    # demo-e2e unsharded (ci.yml splits it across a 4-way matrix). Matches the
    # 35 min ci.yml allows its own main job.
    timeout-minutes: 35
    # Gate the release behind a protected environment. Store RELEASE_TOKEN as an
    # *environment* secret (not a plain repo secret) with required reviewers, so
    # a `workflow_dispatch` on an untrusted ref cannot reach the admin push token
    # without human approval. GitHub auto-creates this environment on first run;
    # add the protection rules in Settings > Environments > release.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: tree:0
          # SECURITY: do not persist any credential into .git/config here. The
          # install + `nx affected` steps below execute untrusted dependency
          # code; a persisted admin token could be exfiltrated by a malicious
          # package. The privileged push credential is bound late, only in the
          # Release step, after all third-party code has finished running.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Fail fast if the release credential is missing, expired, or revoked.
      # A release runs a ~15 min quality gate before it ever touches the push
      # token; without this the only signal of an expired PAT is a failure at
      # the very end. Deliberately placed BEFORE `pnpm install`: no
      # third-party code has executed yet, so the token is never resident in
      # the environment while untrusted dependency code runs.
      - name: Verify release credential
        env:
          # Resolved separately from the token itself: the `||` fallback below
          # is indistinguishable from a real RELEASE_TOKEN once evaluated, so
          # without this the preflight would happily green-light a run that
          # has no push credential at all.
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
            echo "::error::RELEASE_TOKEN is not set on the 'release' environment."
            echo "The workflow would fall back to GITHUB_TOKEN, which cannot push to" >&2
            echo "protected main, so the Release step would fail only after the full" >&2
            echo "quality gate has already run. Add the secret in" >&2
            echo "Settings > Environments > release." >&2
            exit 1
          fi

          BODY=$(mktemp)
          HEADERS=$(mktemp)
          CODE=$(curl -sS -o "$BODY" -D "$HEADERS" -w '%{http_code}' \
            -H "Authorization: Bearer $RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY")

          if [ "$CODE" != "200" ]; then
            echo "::error::RELEASE_TOKEN could not authenticate against $GITHUB_REPOSITORY (HTTP $CODE)."
            echo "The token is expired, revoked, or invalid. Mint a new one and update" >&2
            echo "the RELEASE_TOKEN secret in Settings > Environments > release." >&2
            exit 1
          fi

          # GitHub returns this header for PATs that carry an expiry date.
          EXPIRY=$(grep -i '^github-authentication-token-expiration:' "$HEADERS" \
            | cut -d: -f2- | sed 's/^ *//' | tr -d '\r')

          if [ -n "$EXPIRY" ]; then
            echo "Release credential expires: $EXPIRY"
            echo "- Release credential expires: \`$EXPIRY\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release credential has no expiration date set."
            echo "- Release credential: no expiry" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Warn (do not block) if push access is not visible: the permissions
          # object is absent for some GitHub App installation tokens that can
          # still push perfectly well.
          PUSH=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); p=d.get('permissions'); print('' if p is None else str(p.get('push', False)).lower())" "$BODY")
          if [ "$PUSH" = "false" ]; then
            echo "::warning::RELEASE_TOKEN authenticated but reports no push permission on $GITHUB_REPOSITORY; the Release step may fail."
          fi

          echo "Release credential OK."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Configure Nx Cloud access
        env:
          NX_CLOUD_ACCESS_TOKEN_RW: ${{ secrets['NX_CLOUD_ACCESS_TOKEN_RW'] }}
          NX_CLOUD_ACCESS_TOKEN_RO: ${{ secrets['NX_CLOUD_ACCESS_TOKEN_RO'] }}
        run: |
          TOKEN="$NX_CLOUD_ACCESS_TOKEN_RW"
          if [ -z "$TOKEN" ]; then
            TOKEN="$NX_CLOUD_ACCESS_TOKEN_RO"
          fi

          if [ -n "$TOKEN" ]; then
            echo "NX_CLOUD_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "NX_NO_CLOUD=false" >> "$GITHUB_ENV"
            echo "Nx Cloud enabled for release workflow."
          else
            echo "NX_NO_CLOUD=true" >> "$GITHUB_ENV"
            echo "No Nx Cloud token configured. Running release workflow without Nx Cloud."
          fi

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1
        continue-on-error: true

      - name: Nx Report
        # nx-safe.sh keeps diagnostics available even if Nx Cloud auth is broken.
        run: bash .github/scripts/nx-safe.sh pnpm exec nx report --outputStyle=static

      - name: Check formatting
        env:
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
        run: bash .github/scripts/nx-safe.sh pnpm run format:check

      - name: Verify Quality (Lint, Test, Build, E2E)
        # Using affected ensures we only verify what changed, but caching handles the rest.
        # We target all projects to ensure workspace health before release.
        # nx-safe.sh falls back to local execution if Nx Cloud rejects our token.
        #
        # Use the non-atomized `e2e` target, never `e2e-ci`. The Playwright
        # plugin's `ciTargetName: e2e-ci` (nx.json) splits each suite into
        # per-spec tasks that Nx refuses to run without Nx Agents, and this
        # workspace stopped distributing in #252. ci.yml was switched at the
        # same time; this gate was missed and broke for any release whose
        # affected set contains an e2e project.
        run: bash .github/scripts/nx-safe.sh pnpm exec nx affected -t lint test test-browser build e2e --outputStyle=static

      - name: Validate release inputs
        env:
          VERSION: ${{ inputs.version }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          PRERELEASE_ID: ${{ inputs.prerelease_id }}
        run: |
          if [[ "$VERSION" == pre* ]] && [[ ! "$PRERELEASE_ID" =~ ^(beta|rc|alpha)$ ]]; then
            echo "❌ prerelease_id must be one of: beta, rc, alpha." >&2
            exit 1
          fi

          if [ "$VERSION" = "custom" ]; then
            if [ -z "$CUSTOM_VERSION" ]; then
              echo "❌ custom_version is required when version=custom." >&2
              exit 1
            fi

            if [[ ! "$CUSTOM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "❌ custom_version must be a valid semver-like version such as 1.2.3 or 1.2.3-beta.1." >&2
              exit 1
            fi
          fi

      - name: Determine version command
        id: version_cmd
        run: |
          VERSION="${{ inputs.version }}"
          if [ "$VERSION" = "custom" ]; then
            printf 'cmd=%s\n' "${{ inputs.custom_version }}" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == pre* ]]; then
            # prepatch, preminor, premajor, prerelease all use --preid
            printf 'cmd=%s --preid=%s\n' "$VERSION" "${{ inputs.prerelease_id }}" >> "$GITHUB_OUTPUT"
          else
            printf 'cmd=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine first-release flag
        id: first_release_flag
        run: |
          if [ "${{ inputs.first_release }}" = "true" ]; then
            printf 'flag=%s\n' '--first-release' >> "$GITHUB_OUTPUT"
          else
            printf 'flag=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Preview Release Changelog
        run: |
          echo "## 📋 Release Preview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Running: \`nx release ${{ steps.version_cmd.outputs.cmd }} --skip-publish --dry-run ${{ steps.first_release_flag.outputs.flag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          bash .github/scripts/nx-safe.sh pnpm exec nx release ${{ steps.version_cmd.outputs.cmd }} --skip-publish --dry-run ${{ steps.first_release_flag.outputs.flag }} > /tmp/release-preview.txt 2>&1 || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          head -100 /tmp/release-preview.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release (Dry Run)
        if: ${{ inputs.dry_run }}
        run: bash .github/scripts/nx-safe.sh pnpm exec nx release ${{ steps.version_cmd.outputs.cmd }} --skip-publish --dry-run ${{ steps.first_release_flag.outputs.flag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        if: ${{ !inputs.dry_run }}
        # Run nx release directly, never through nx-safe.sh: this command is
        # non-idempotent (version bump, changelog, tag, commit, push). If Nx
        # Cloud fails mid-sequence, retrying could create duplicate tags or a
        # corrupted release. Fail loudly and let a human re-run cleanly.
        #
        # The push credential is bound here and nowhere earlier: RELEASE_TOKEN is
        # an admin-scoped token (PAT with Contents:write, or a GitHub App token)
        # that bypasses the `main` ruleset; GITHUB_TOKEN cannot push to protected
        # main. The token comes from env (never inlined into the command, so it
        # is not logged). Falls back to GITHUB_TOKEN when the secret is unset.
        run: |
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          pnpm exec nx release ${{ steps.version_cmd.outputs.cmd }} --skip-publish ${{ steps.first_release_flag.outputs.flag }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve created release tag
        if: ${{ !inputs.dry_run }}
        id: release_info
        run: |
          git fetch --tags --force

          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' | head -n 1)

          if [ -z "$TAG" ]; then
            TAG=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' | head -n 1)
          fi

          if [ -z "$TAG" ]; then
            echo "❌ No release tag found after nx release" >&2
            git tag --list 'v*' --sort=-version:refname | head -5 >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG"

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ steps.version_cmd.outputs.cmd }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dry Run: ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- First Release Mode: ${{ inputs.first_release }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "- Git Tag: ${{ steps.release_info.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
            echo "- Publish: run the separate Publish workflow with ref=${{ steps.release_info.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          fi
