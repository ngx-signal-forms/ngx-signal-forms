name: Release

# Manually create versioned releases with changelog and git tags
# Publishing is intentionally handled by the separate Publish workflow.
#
# Release types:
#   - patch/minor/major: Stable releases → npm tag: latest
#   - prerelease --preid=beta: Beta releases → npm tag: beta (e.g., 1.0.0-beta.1)
#   - prerelease --preid=rc: Release candidates → npm tag: rc (e.g., 1.0.0-rc.1)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type or exact version'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
          - custom
      custom_version:
        description: 'Custom version (only if "custom" is selected)'
        required: false
        type: string
      prerelease_id:
        description: 'Prerelease identifier (for pre* versions)'
        required: false
        type: choice
        default: 'beta'
        options:
          - beta
          - rc
          - alpha
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false
      first_release:
        description: 'Treat as first Nx-managed release (uses --first-release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

# Three jobs:
#   release:        install, checks, `nx release version`. Commits and tags
#                   locally, pushes nothing, and uploads the result as a git
#                   bundle.
#   push:           verifies the bundle, creates a GitHub App token and runs
#                   `git push`. It installs nothing and runs no repo code.
#   github-release: `nx release changelog` creates the GitHub release with the
#                   workflow's own `GITHUB_TOKEN`.
# A dry run runs `release` only.
jobs:
  release:
    name: Version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The quality gate runs every affected e2e suite in this one job, including
    # demo-e2e unsharded (ci.yml splits it across a 4-way matrix). Matches the
    # 35 min ci.yml allows its own main job.
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.release_info.outputs.tag }}
      sha: ${{ steps.release_info.outputs.sha }}
    steps:
      - name: Require main
        if: ${{ !inputs.dry_run }}
        run: |
          # The push job moves `main`. Fail early if this is another branch.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run the Release workflow from main, not from $GITHUB_REF." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: tree:0
          # Persist no credential. Only the `push` job creates a push token.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - name: Install dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Configure Nx Cloud access
        env:
          NX_CLOUD_ACCESS_TOKEN_RW: ${{ secrets['NX_CLOUD_ACCESS_TOKEN_RW'] }}
          NX_CLOUD_ACCESS_TOKEN_RO: ${{ secrets['NX_CLOUD_ACCESS_TOKEN_RO'] }}
        run: |
          TOKEN="$NX_CLOUD_ACCESS_TOKEN_RW"
          if [ -z "$TOKEN" ]; then
            TOKEN="$NX_CLOUD_ACCESS_TOKEN_RO"
          fi

          if [ -n "$TOKEN" ]; then
            echo "NX_CLOUD_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "NX_NO_CLOUD=false" >> "$GITHUB_ENV"
            echo "Nx Cloud enabled for release workflow."
          else
            echo "NX_NO_CLOUD=true" >> "$GITHUB_ENV"
            echo "No Nx Cloud token configured. Running release workflow without Nx Cloud."
          fi

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1

      - name: Nx Report
        run: pnpm exec nx report --outputStyle=static

      - name: Check formatting
        env:
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
        run: pnpm run format:check

      - name: Verify toolkit quality (lint, test, test-browser, build)
        # A release must prove the full toolkit suite passes at the tagged
        # commit, not just the projects `nx affected` thinks changed against
        # main. Runs every toolkit target directly with `run-many -p toolkit`.
        run: pnpm exec nx run-many -t lint test test-browser build -p toolkit --outputStyle=static

      - name: Enforce coverage thresholds
        # A release is dispatched by hand and does not wait for ci.yml's
        # `coverage` job, so check the thresholds here too.
        run: pnpm exec nx run workspace:coverage --outputStyle=static

      - name: Check README starter
        run: pnpm exec nx run toolkit:check-documentation-starter --outputStyle=static

      # Guards the PUBLISHED package (dist/packages/toolkit), same as the
      # matching ci.yml steps: an unreviewed public API/tarball change, a
      # broken exports map/types condition, or a bundle-size regression must
      # block a release, not just a PR (#514). See docs/CONTRIBUTING.md
      # "Published package guardrails" for how to update a baseline. Run via
      # `run-many` so `toolkit:build` (their shared dependency) runs
      # once instead of once per `nx run`.
      - name: Check published API surface, tarball contents, and package shape
        run: pnpm exec nx run-many -t check-published-package check-package-shape -p toolkit --outputStyle=static

      - name: Check bundle size budget
        run: pnpm exec nx run toolkit:check-size --outputStyle=static

      # Same isolation check as ci.yml's `toolkit-isolation` job: prove the
      # published toolkit stays design-system-free.
      #
      # Unlike that job, this one already ran a full `pnpm install` above, so
      # this filtered install is a no-op ("Already up to date") and does not
      # remove any package the full install added. The check still catches a
      # leak, because pnpm's default (non-hoisted) linker only symlinks a
      # project's own declared dependencies into that project's own
      # node_modules folder. A demo app's design-system package (for example
      # apps/demo-material/node_modules/@angular/material) is never linked
      # into packages/toolkit/node_modules or the workspace root, so an
      # accidental `import` of it from toolkit source still fails to resolve
      # at build time, confirmed by reproducing the leak locally. `pnpm
      # check:toolkit-peer-deps` covers the other case, a design-system
      # package declared in the toolkit's own package.json. The workspace
      # ROOT declares no design-system package, so nothing resolves from the
      # toolkit by walking up to the root.
      - name: Assert toolkit declares no design-system deps
        run: pnpm check:toolkit-peer-deps

      - name: Install only toolkit + its dependencies
        run: sfw pnpm install --frozen-lockfile --filter "@ngx-signal-forms/toolkit..."

      - name: Build toolkit in isolation
        # Skip the cache: the earlier build step already cached this hash, and
        # a cache hit would never build against the pruned node_modules.
        run: pnpm exec nx build toolkit --skip-nx-cache

      - name: Restore full workspace install
        run: sfw pnpm install --frozen-lockfile

      - name: Verify e2e (affected)
        # e2e suites are slow; keep this one affected so release run time
        # does not regress. The rest of the quality gate above always runs
        # in full, unaffected by what changed.
        run: pnpm exec nx affected -t e2e --outputStyle=static

      - name: Validate release inputs
        env:
          VERSION: ${{ inputs.version }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          PRERELEASE_ID: ${{ inputs.prerelease_id }}
        run: |
          if [[ "$VERSION" == pre* ]] && [[ ! "$PRERELEASE_ID" =~ ^(beta|rc|alpha)$ ]]; then
            echo "❌ prerelease_id must be one of: beta, rc, alpha." >&2
            exit 1
          fi

          if [ "$VERSION" = "custom" ]; then
            if [ -z "$CUSTOM_VERSION" ]; then
              echo "❌ custom_version is required when version=custom." >&2
              exit 1
            fi

            if [[ ! "$CUSTOM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "❌ custom_version must be a valid semver-like version such as 1.2.3 or 1.2.3-beta.1." >&2
              exit 1
            fi
          fi

      - name: Determine version command
        id: version_cmd
        env:
          VERSION: ${{ inputs.version }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          PRERELEASE_ID: ${{ inputs.prerelease_id }}
        run: |
          if [ "$VERSION" = "custom" ]; then
            printf 'cmd=%s\n' "$CUSTOM_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == pre* ]]; then
            # prepatch, preminor, premajor, prerelease all use --preid
            printf 'cmd=%s --preid=%s\n' "$VERSION" "$PRERELEASE_ID" >> "$GITHUB_OUTPUT"
          else
            printf 'cmd=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine first-release flag
        id: first_release_flag
        env:
          FIRST_RELEASE: ${{ inputs.first_release }}
        run: |
          if [ "$FIRST_RELEASE" = "true" ]; then
            printf 'flag=%s\n' '--first-release' >> "$GITHUB_OUTPUT"
          else
            printf 'flag=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Version, commit and tag locally
        # `nx release version` bumps the version, commits and tags, and pushes
        # nothing. The `release.version.git` block in nx.json sets the commit
        # message and the tag message.
        env:
          VERSION_CMD: ${{ steps.version_cmd.outputs.cmd }}
          FIRST_RELEASE_FLAG: ${{ steps.first_release_flag.outputs.flag }}
        run: |
          read -r -a VERSION_ARGS <<< "$VERSION_CMD"
          read -r -a FIRST_RELEASE_ARGS <<< "$FIRST_RELEASE_FLAG"
          pnpm exec nx release version "${VERSION_ARGS[@]}" "${FIRST_RELEASE_ARGS[@]}"

      - name: Resolve created release tag
        id: release_info
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' | head -n 1)

          if [ -z "$TAG" ]; then
            echo "❌ No release tag found after nx release version" >&2
            git tag --list 'v*' --sort=-version:refname | head -5 >&2
            exit 1
          fi

          # The commit must sit directly on main, and be the only new commit.
          if [ "$(git rev-list --count origin/main..HEAD)" != "1" ]; then
            echo "❌ Expected exactly one release commit on top of origin/main." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG"

      # This step is also the release pre-flight. It runs the changelog
      # renderer, which requires `docs/migrations/v<version>.md`. A failed run
      # fails the job here with the renderer's own message, before anything is
      # pushed. `--dry-run` writes nothing and creates no release.
      - name: Preview release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_info.outputs.tag }}
          FIRST_RELEASE_FLAG: ${{ steps.first_release_flag.outputs.flag }}
        run: |
          read -r -a FIRST_RELEASE_ARGS <<< "$FIRST_RELEASE_FLAG"
          if [ -n "$FIRST_RELEASE_FLAG" ]; then
            RANGE_ARGS=()
          else
            # The new tag is on HEAD. Start the notes at the tag before it.
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^")
            RANGE_ARGS=(--from "$PREVIOUS_TAG")
          fi

          set +e
          pnpm exec nx release changelog "${TAG#v}" "${RANGE_ARGS[@]}" "${FIRST_RELEASE_ARGS[@]}" \
            --git-commit=false --git-tag=false --git-push=false --dry-run > /tmp/release-preview.txt 2>&1
          STATUS=$?
          set -e

          {
            echo "## 📋 Release Preview"
            echo ""
            echo "Running: \`nx release changelog ${TAG#v} --dry-run\`"
            echo "\`\`\`"
            head -n 100 /tmp/release-preview.txt
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" -ne 0 ]; then
            echo "❌ Release notes preview failed with exit code $STATUS. The release did not start." >&2
            tail -n 20 /tmp/release-preview.txt >&2
            exit "$STATUS"
          fi

      - name: Bundle the release commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.release_info.outputs.tag }}
        run: git bundle create release.bundle origin/main..HEAD "refs/tags/$TAG"

      - name: Upload release bundle
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bundle
          path: release.bundle
          if-no-files-found: error
          retention-days: 1

      - name: Summary
        env:
          VERSION_CMD: ${{ steps.version_cmd.outputs.cmd }}
          DRY_RUN: ${{ inputs.dry_run }}
          FIRST_RELEASE: ${{ inputs.first_release }}
          TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $VERSION_CMD" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry Run: $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "- First Release Mode: $FIRST_RELEASE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git Tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" != "true" ]; then
            echo "- Next: the push job pushes the tag. The push starts the Publish workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Pushes the release commit and tag. This job installs nothing and runs no
  # repo code. It checks the bundle from the `release` job, then creates a
  # GitHub App token and pushes.
  # The `release` environment holds the App variable and secret
  # (`RELEASE_APP_ID`, `RELEASE_APP_PRIVATE_KEY`) and its required reviewers
  # approve the push.
  push:
    name: Push release commit and tag
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
      EXPECTED_SHA: ${{ needs.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: bundle

      - name: Verify the bundle
        run: |
          set -o pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "❌ Push only from main, not from $GITHUB_REF." >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "❌ The release job returned an invalid tag or SHA." >&2
            exit 1
          fi

          # Main must not have moved since the release job started.
          git fetch --no-tags origin main
          git bundle verify bundle/release.bundle
          git fetch --no-tags bundle/release.bundle \
            "refs/tags/${TAG}:refs/tags/${TAG}" \
            "HEAD:refs/heads/release-candidate"

          CANDIDATE=$(git rev-parse refs/heads/release-candidate)
          TAG_COMMIT=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [ "$CANDIDATE" != "$EXPECTED_SHA" ] || [ "$TAG_COMMIT" != "$EXPECTED_SHA" ]; then
            echo "❌ The bundle does not match the expected commit $EXPECTED_SHA." >&2
            exit 1
          fi

          # A fast-forward of main by exactly one commit.
          if [ "$(git rev-list --parents -n 1 "$CANDIDATE" | wc -w | tr -d ' ')" != "2" ] || [ "$(git rev-parse "${CANDIDATE}^")" != "$(git rev-parse origin/main)" ]; then
            echo "❌ The release commit is not a single commit on top of origin/main." >&2
            exit 1
          fi

          # A release commit changes one file: packages/toolkit/package.json.
          CHANGED=$(git diff --name-only origin/main "$CANDIDATE")
          if [ "$CHANGED" != "packages/toolkit/package.json" ]; then
            echo "❌ A release commit must change only packages/toolkit/package.json. It changes:" >&2
            echo "$CHANGED" >&2
            exit 1
          fi

          # Only the version value changes. Every other field stays the same.
          OLD_REST=$(git show origin/main:packages/toolkit/package.json | jq -S 'del(.version)')
          NEW_REST=$(git show "$CANDIDATE:packages/toolkit/package.json" | jq -S 'del(.version)')
          if [ "$OLD_REST" != "$NEW_REST" ]; then
            echo "❌ The release commit changes more than the version in package.json." >&2
            echo "$OLD_REST" > "$RUNNER_TEMP/package.old.json"
            echo "$NEW_REST" > "$RUNNER_TEMP/package.new.json"
            diff "$RUNNER_TEMP/package.old.json" "$RUNNER_TEMP/package.new.json" >&2 || true
            exit 1
          fi
          NEW_VERSION=$(git show "$CANDIDATE:packages/toolkit/package.json" | jq -r '.version')
          if [ "$NEW_VERSION" != "${TAG#v}" ]; then
            echo "❌ package.json version '$NEW_VERSION' does not match tag '$TAG'." >&2
            exit 1
          fi

      # The App token is scoped to this repository with `contents: write`.
      - name: Create App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # Check the token before the push. The token comes from env only.
      - name: Verify release credential
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "::error::No App token was created." >&2
            exit 1
          fi

          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $APP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY")

          if [ "$CODE" != "200" ]; then
            echo "::error::The App token could not read $GITHUB_REPOSITORY (HTTP $CODE)." >&2
            exit 1
          fi

          echo "Release credential OK."

      # The App is a bypass actor on the `main` ruleset; `GITHUB_TOKEN` cannot
      # push to protected main. The token goes in one command-scoped header and
      # is never written to .git/config. This push starts the Publish workflow.
      - name: Push release commit and tag
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push --no-verify --atomic origin \
            "refs/heads/release-candidate:refs/heads/main" \
            "refs/tags/${TAG}:refs/tags/${TAG}"

  # `nx release changelog` runs third-party code (Nx, the renderer). It gets
  # only the workflow's own `GITHUB_TOKEN`, which cannot bypass the `main`
  # ruleset.
  github-release:
    name: Create GitHub release
    needs: [release, push]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - name: Install dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
          TAG: ${{ needs.release.outputs.tag }}
          FIRST_RELEASE: ${{ inputs.first_release }}
        run: |
          git fetch --tags --force
          if [ "$FIRST_RELEASE" = "true" ]; then
            RANGE_ARGS=(--first-release)
          else
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^")
            RANGE_ARGS=(--from "$PREVIOUS_TAG")
          fi

          pnpm exec nx release changelog "${TAG#v}" "${RANGE_ARGS[@]}" \
            --git-commit=false --git-tag=false --git-push=false
