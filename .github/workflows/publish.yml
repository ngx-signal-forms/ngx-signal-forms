name: Publish

# Publishes the toolkit on a `v*` tag push or by hand, through npm Trusted
# Publishers (OIDC). Only the maintainer releases.
#
# How to release:
#   1. Open a release-prep pull request that bumps the version:
#        pnpm nx release version prerelease --preid=rc  # or patch, minor, major, 1.0.0
#      It changes only `packages/toolkit/package.json` and does not commit or
#      tag. A release with breaking changes also adds
#      `docs/migrations/v<version>.md`; `build` fails without it.
#   2. Tag the prep PR's merge commit and push the tag. Tag that commit, not
#      `origin/main`, because another PR may have merged since. The tag must
#      match the version in `packages/toolkit/package.json`. Only admins can
#      create, move or delete `v*` tags.
#        SHA=$(gh pr view <prep-pr> --json mergeCommit --jq .mergeCommit.oid)
#        git tag -a v<version> -m "Release <version>" "$SHA"
#        git push origin v<version>
#   3. Approve the `npm-publish` deployment when `publish` waits for it.
#
# Release notes are the GitHub releases. There is no CHANGELOG.md.
#
# To check an existing tag without publishing, dispatch a dry run from `main`.
# The dispatch `--ref` picks which `publish.yml` runs, so `main` runs the
# current checks against the tag's tree:
#   gh workflow run publish.yml --ref main -f ref=<tag> -f dry_run=true
#
# When a release fails. Immutable releases lock a tag once its GitHub release
# exists. Until then, the tag can be deleted and pushed again
# (`git push origin :refs/tags/<tag>` and `git tag -d <tag>`).
#   - `build` fails: nothing is published. Delete the tag, fix it in a PR and
#     tag again.
#   - `publish` approval rejected: nothing is published. Delete the tag.
#   - `publish` fails: check `npm view @ngx-signal-forms/toolkit@<version>`.
#     If the version is not on npm, re-run the failed jobs for a transient
#     failure, or delete the tag. If it is, re-run the failed jobs: `publish`
#     skips the upload when npm holds this run's exact package, and
#     `github-release` follows. npm can take a few minutes to list a new
#     version, and the uploaded package expires after 7 days.
#   - `github-release` fails: re-run the failed job. Do not dispatch the
#     workflow again: a new run builds the package again, and `publish`
#     refuses a version npm already has unless the rebuilt package is
#     identical.
#   - A published version has a defect: keep the tag. npm never reuses a
#     version. Run `npm deprecate` on it and release a fix. Within 72 hours, a
#     version with no dependents can be unpublished. Moving a dist-tag needs an
#     authenticated `npm dist-tag add`.
#   - To re-run a publish by hand, dispatch on the tag, not on `main`. The
#     `npm-publish` environment only accepts `v*` tags:
#       gh workflow run publish.yml --ref <tag> -f ref=<tag>
#
# Jobs, split on purpose:
#   - build:           runs all third-party code (install, release checks,
#                      build). Read-only token. It has no OIDC token.
#   - publish:         holds the OIDC token. It installs nothing and runs no
#                      repo script. It downloads the built package and runs
#                      `npm publish`. It waits for approval on the
#                      `npm-publish` environment.
#   - github-release:  runs only after a successful publish.
#                      `nx release changelog` creates the GitHub release with
#                      the workflow's own `GITHUB_TOKEN`.
#   - publish-dry-run: the same steps as `publish` for a dry run, with
#                      `--dry-run` and no environment. The steps are
#                      duplicated on purpose.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact release tag or full commit SHA (e.g. v1.2.3 or 40-character SHA)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build package
    runs-on: ubuntu-latest
    # The release checks run every affected e2e suite in this one job,
    # including demo-e2e unsharded (ci.yml splits it across a 4-way matrix).
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_info.outputs.tag }}
      previous_tag: ${{ steps.release_info.outputs.previous_tag }}
      dist_tag: ${{ steps.release_info.outputs.dist_tag }}
      node_version: ${{ steps.node_version.outputs.version }}
    steps:
      - name: Resolve and validate publish ref
        id: publish_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          PUSH_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            REF="$PUSH_REF_NAME"
          else
            REF="$INPUT_REF"
          fi

          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] && [[ ! "$REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "❌ Publish ref must be an exact release tag (for example v1.2.3 or v1.2.3-beta.1) or a full 40-character commit SHA." >&2
            exit 1
          fi

          printf 'ref=%s\n' "$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: tree:0
          ref: ${{ steps.publish_ref.outputs.ref }}
          persist-credentials: false

      # Runs before any install or build. Only commits that are on `main`
      # (and so passed the `main` ruleset) can reach npm.
      - name: Require that the release commit is on main
        env:
          PUBLISH_REF: ${{ steps.publish_ref.outputs.ref }}
        run: |
          git fetch --no-tags origin main
          TAG_SHA=$(git rev-parse "${PUBLISH_REF}^{commit}")
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "❌ Commit $TAG_SHA ($PUBLISH_REF) is not on main. Refusing to publish." >&2
            exit 1
          fi
          echo "Commit $TAG_SHA is an ancestor of origin/main."

      - name: Resolve release tag and dist-tag
        id: release_info
        env:
          PUBLISH_REF: ${{ steps.publish_ref.outputs.ref }}
        run: |
          git fetch --tags --force

          # Check if ref is already a tag
          if git rev-parse "${PUBLISH_REF}^{tag}" >/dev/null 2>&1; then
            TAG="$PUBLISH_REF"
            echo "Using provided tag: $TAG"
          else
            # Find tag at the commit SHA
            REF_SHA=$(git rev-parse "$PUBLISH_REF")
            echo "Looking for tag at commit: $REF_SHA"
            TAG=$(git tag --points-at "$REF_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)

            if [ -z "$TAG" ]; then
              echo "❌ No release tag found at ref $PUBLISH_REF" >&2
              echo "Only exact tagged refs are allowed for publish to avoid accidental wrong-version publishes." >&2
              echo "Available tags:" >&2
              git tag --list 'v*' --sort=-version:refname | head -5 >&2
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Fail before the long checks if the tag points at a commit without
          # the version bump from the release-prep pull request.
          PACKAGE_VERSION=$(jq -r '.version' packages/toolkit/package.json)
          if [ "v$PACKAGE_VERSION" != "$TAG" ]; then
            echo "❌ Tag '$TAG' does not match packages/toolkit/package.json version '$PACKAGE_VERSION'." >&2
            exit 1
          fi

          # Release notes and affected e2e both start at the previous release.
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^")
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

          # Determine npm dist-tag based on version
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *"-next"* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-beta"* ]]; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-rc"* ]]; then
            echo "dist_tag=rc" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-alpha"* ]]; then
            echo "dist_tag=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved: tag=$TAG, previous_tag=$PREVIOUS_TAG"

      # The publish job has no checkout. It reads the Node version from here.
      - name: Read Node version
        id: node_version
        run: echo "version=$(tr -d '[:space:]' < .node-version)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - name: Install dependencies
        run: sfw pnpm install --frozen-lockfile

      # Read-only: a publish run reads the Nx Cloud cache and never writes it.
      - name: Configure Nx Cloud access
        env:
          NX_CLOUD_ACCESS_TOKEN_RO: ${{ secrets['NX_CLOUD_ACCESS_TOKEN_RO'] }}
        run: |
          if [ -n "$NX_CLOUD_ACCESS_TOKEN_RO" ]; then
            echo "NX_CLOUD_ACCESS_TOKEN=$NX_CLOUD_ACCESS_TOKEN_RO" >> "$GITHUB_ENV"
            echo "NX_NO_CLOUD=false" >> "$GITHUB_ENV"
            echo "Nx Cloud enabled (read-only) for publish workflow."
          else
            echo "NX_NO_CLOUD=true" >> "$GITHUB_ENV"
            echo "No Nx Cloud token configured. Running publish workflow without Nx Cloud."
          fi

      - name: Nx Report
        run: pnpm exec nx report --outputStyle=static

      # This step is also the release pre-flight. It runs the changelog
      # renderer, which requires `docs/migrations/v<version>.md` when the
      # release has breaking changes. `--dry-run` writes nothing and creates
      # no release.
      - name: Preview release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_info.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.release_info.outputs.previous_tag }}
        run: |
          set +e
          pnpm exec nx release changelog "${TAG#v}" --from "$PREVIOUS_TAG" \
            --git-commit=false --git-tag=false --git-push=false --dry-run > "$RUNNER_TEMP/release-preview.txt" 2>&1
          STATUS=$?
          set -e

          {
            echo "## 📋 Release Preview"
            echo ""
            echo "Running: \`nx release changelog ${TAG#v} --dry-run\`"
            echo "\`\`\`"
            head -n 100 "$RUNNER_TEMP/release-preview.txt"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" -ne 0 ]; then
            echo "❌ Release notes preview failed with exit code $STATUS." >&2
            tail -n 20 "$RUNNER_TEMP/release-preview.txt" >&2
            exit "$STATUS"
          fi

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Check formatting
        env:
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
        run: pnpm run format:check

      - name: Verify toolkit quality (lint, test, test-browser, build)
        # A release must prove the full toolkit suite passes at the tagged
        # commit, not just the projects `nx affected` thinks changed. Runs
        # every toolkit target directly with `run-many -p toolkit`.
        run: pnpm exec nx run-many -t lint test test-browser build -p toolkit --outputStyle=static

      - name: Enforce coverage thresholds
        # A tag push does not wait for ci.yml's `coverage` job, so check the
        # thresholds here too.
        run: pnpm exec nx run workspace:coverage --outputStyle=static

      - name: Check README starter
        run: pnpm exec nx run toolkit:check-documentation-starter --outputStyle=static

      # Guards the PUBLISHED package (dist/packages/toolkit), same as the
      # matching ci.yml steps: an unreviewed public API/tarball change, a
      # broken exports map/types condition, or a bundle-size regression must
      # block a release, not just a PR (#514). See docs/CONTRIBUTING.md
      # "Published package guardrails" for how to update a baseline. Run via
      # `run-many` so `toolkit:build` (their shared dependency) runs
      # once instead of once per `nx run`.
      - name: Check published API surface, tarball contents, and package shape
        run: pnpm exec nx run-many -t check-published-package check-package-shape -p toolkit --outputStyle=static

      - name: Check bundle size budget
        run: pnpm exec nx run toolkit:check-size --outputStyle=static

      # Same isolation check as ci.yml's `toolkit-isolation` job: prove the
      # published toolkit stays design-system-free.
      #
      # Unlike that job, this one already ran a full `pnpm install` above, so
      # this filtered install is a no-op ("Already up to date") and does not
      # remove any package the full install added. The check still catches a
      # leak, because pnpm's default (non-hoisted) linker only symlinks a
      # project's own declared dependencies into that project's own
      # node_modules folder. A demo app's design-system package (for example
      # apps/demo-material/node_modules/@angular/material) is never linked
      # into packages/toolkit/node_modules or the workspace root, so an
      # accidental `import` of it from toolkit source still fails to resolve
      # at build time, confirmed by reproducing the leak locally. `pnpm
      # check:toolkit-peer-deps` covers the other case, a design-system
      # package declared in the toolkit's own package.json. The workspace
      # ROOT declares no design-system package, so nothing resolves from the
      # toolkit by walking up to the root.
      - name: Assert toolkit declares no design-system deps
        run: pnpm check:toolkit-peer-deps

      - name: Install only toolkit + its dependencies
        run: sfw pnpm install --frozen-lockfile --filter "@ngx-signal-forms/toolkit..."

      - name: Build toolkit in isolation
        # Skip the cache: the earlier build step already cached this hash, and
        # a cache hit would never build against the pruned node_modules.
        run: pnpm exec nx build toolkit --skip-nx-cache

      - name: Restore full workspace install
        run: sfw pnpm install --frozen-lockfile

      - name: Verify e2e (affected since the previous release)
        # e2e suites are slow; keep this one affected so release run time
        # does not regress. The rest of the checks above always run in full.
        env:
          PREVIOUS_TAG: ${{ steps.release_info.outputs.previous_tag }}
        run: pnpm exec nx affected -t e2e --base="$PREVIOUS_TAG" --head=HEAD --outputStyle=static

      # `toolkit:build` also runs the post-build steps (README, LICENSE, strip
      # internal members and exports).
      - name: Build toolkit package
        run: pnpm exec nx build toolkit --skip-nx-cache --outputStyle=static

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: toolkit-package
          path: dist/packages/toolkit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ inputs.dry_run != true }}
    permissions:
      id-token: write # Required for npm Trusted Publishers (OIDC)
    # A real publish waits for approval on the `npm-publish` environment.
    environment: npm-publish
    # This job must install nothing and run no repo script: it holds the OIDC
    # token. Do not add `pnpm install`, `npm ci`, a checkout or a build step.
    # It publishes with the npm bundled with Node (from `.node-version`); the
    # preflight step checks that version.
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ needs.build.outputs.node_version }}
          registry-url: 'https://registry.npmjs.org'
          scope: '@ngx-signal-forms'

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolkit-package
          path: dist/packages/toolkit

      - name: Enforce OIDC auth mode for npm publish
        run: |
          # Clear token-based auth so npm Trusted Publisher OIDC is used.
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
          echo "NPM_TOKEN=" >> "$GITHUB_ENV"

          npm config delete //registry.npmjs.org/:_authToken --location=user || true

          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi

      - name: Validate npm trusted publishing preflight
        run: |
          npm --version
          node --version

          NPM_VERSION=$(npm --version)
          node -e "const [major,minor,patch]=process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) { process.exit(1); }" "$NPM_VERSION" || {
            echo "❌ npm $NPM_VERSION is too old for npm Trusted Publisher OIDC (requires >= 11.5.1)." >&2
            exit 1
          }

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "❌ OIDC token endpoint is not available in this job." >&2
            echo "Ensure the job permissions include: id-token: write" >&2
            exit 1
          fi
          echo "OIDC and npm version requirements are satisfied for trusted publishing."

      - name: Publish toolkit
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          TAG: ${{ needs.build.outputs.tag }}
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: |
          PACKAGE_NAME=$(node -p "require('./dist/packages/toolkit/package.json').name")
          PACKAGE_VERSION=$(node -p "require('./dist/packages/toolkit/package.json').version")

          # Guard against a mis-pointed tag or a manual dispatch against the wrong
          # SHA: the npm dist-tag is derived from the git tag name, while the
          # published version comes from the built package.json. If they disagree,
          # fail loudly instead of silently publishing under the wrong dist-tag.
          if [ "v$PACKAGE_VERSION" != "$TAG" ]; then
            echo "❌ Git tag '$TAG' does not match built package version 'v$PACKAGE_VERSION'." >&2
            echo "Refusing to publish: this would tag/publish the wrong version." >&2
            exit 1
          fi

          PUBLISHED_INTEGRITY=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.integrity 2>/dev/null || true)
          if [ -z "$PUBLISHED_INTEGRITY" ]; then
            npm publish dist/packages/toolkit --tag="$DIST_TAG" --access public --provenance
            exit 0
          fi

          # npm can accept the package while this job still fails (a lost
          # response, a cancelled runner). "Re-run failed jobs" then lands
          # here with the same package. If npm holds exactly this package,
          # succeed so `github-release` runs. The `./` keeps npm from reading
          # the path as a GitHub shorthand. `first(.[])` reads both the array
          # (npm 11) and the object (npm 12) that `npm pack --json` prints.
          BUILT_INTEGRITY=$(npm pack ./dist/packages/toolkit --dry-run --json --ignore-scripts | jq -r 'first(.[]).integrity')
          if [ "$BUILT_INTEGRITY" = "$PUBLISHED_INTEGRITY" ]; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already on npm with this exact package. Skipping the upload."
            exit 0
          fi

          # The trusted publisher does not allow `npm dist-tag`, so this job
          # cannot move a dist-tag either.
          echo "❌ $PACKAGE_NAME@$PACKAGE_VERSION is already on npm with different contents." >&2
          echo "npm never reuses a version. Release a new version instead." >&2
          exit 1
        # npm Trusted Publisher handles authentication automatically

      - name: Summary
        env:
          TAG: ${{ needs.build.outputs.tag }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          DRY_RUN: 'false'
        run: |
          echo "## Publish Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git Tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm Dist Tag: $DIST_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry Run: $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publish client: npm CLI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auth: npm Trusted Publishers (OIDC)" >> "$GITHUB_STEP_SUMMARY"

  # `nx release changelog` runs third-party code (Nx, the renderer). It gets
  # only the workflow's own `GITHUB_TOKEN`, and only in the step that needs
  # it. It runs after npm accepts the package, because immutable releases
  # lock the tag once the release exists.
  github-release:
    name: Create GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - name: Install dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
          TAG: ${{ needs.build.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
        run: |
          pnpm exec nx release changelog "${TAG#v}" --from "$PREVIOUS_TAG" \
            --git-commit=false --git-tag=false --git-push=false

  publish-dry-run:
    name: Publish to npm (dry run)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ inputs.dry_run == true }}
    permissions:
      id-token: write # The preflight step checks that the OIDC endpoint exists
    # No `environment:`. A dry run publishes nothing, so it needs no approval.
    # The OIDC token of this job has no environment claim, so the Trusted
    # Publisher (bound to `npm-publish`) rejects it for a real publish.
    # This job must install nothing and run no repo script: it holds the OIDC
    # token. Do not add `pnpm install`, `npm ci`, a checkout or a build step.
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ needs.build.outputs.node_version }}
          registry-url: 'https://registry.npmjs.org'
          scope: '@ngx-signal-forms'

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolkit-package
          path: dist/packages/toolkit

      - name: Enforce OIDC auth mode for npm publish
        run: |
          # Clear token-based auth so npm Trusted Publisher OIDC is used.
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
          echo "NPM_TOKEN=" >> "$GITHUB_ENV"

          npm config delete //registry.npmjs.org/:_authToken --location=user || true

          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi

      - name: Validate npm trusted publishing preflight
        run: |
          npm --version
          node --version

          NPM_VERSION=$(npm --version)
          node -e "const [major,minor,patch]=process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) { process.exit(1); }" "$NPM_VERSION" || {
            echo "❌ npm $NPM_VERSION is too old for npm Trusted Publisher OIDC (requires >= 11.5.1)." >&2
            exit 1
          }

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "❌ OIDC token endpoint is not available in this job." >&2
            echo "Ensure the job permissions include: id-token: write" >&2
            exit 1
          fi
          echo "OIDC and npm version requirements are satisfied for trusted publishing."

      - name: Publish toolkit (Dry Run)
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: |
          echo "🔍 Dry run - would publish with tag: $DIST_TAG"
          npm publish dist/packages/toolkit --tag="$DIST_TAG" --access public --provenance --dry-run

      - name: Summary
        env:
          TAG: ${{ needs.build.outputs.tag }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          DRY_RUN: 'true'
        run: |
          echo "## Publish Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git Tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm Dist Tag: $DIST_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry Run: $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publish client: npm CLI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auth: npm Trusted Publishers (OIDC)" >> "$GITHUB_STEP_SUMMARY"
