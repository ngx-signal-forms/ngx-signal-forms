# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run agent
        uses: pullfrog/pullfrog@991f983efe1f4d9a04406f7a9fcc9a62780705f4 # v0.1.56
        with:
          prompt: ${{ inputs.prompt }}
        # Provider keys live in the Pullfrog dashboard (encrypted).
        # To BYOK via GHA secrets instead, add a single env var here, e.g.:
        #   env:
        #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
