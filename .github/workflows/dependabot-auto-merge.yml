name: Dependabot auto-merge

# Enable auto-merge for low-risk Dependabot PRs:
#   - any patch bump (incl. patch security fixes)
#   - any security fix (GHSA-tagged) that is not a major bump
#   - minor bumps for dev-dependencies
# GitHub Actions bumps auto-merge only when every action in the PR is
# first-party (`actions/*`, `github/*`, `dependabot/*`) and the bump is not
# major. Third-party actions run with the workflows' tokens, so a person
# reviews each of their bumps. Everything else (prod minors, all majors)
# stays manual.
#
# The actual merge is still gated by branch protection: `--auto` waits for the
# required CI checks to pass before merging. Requires two one-time repo settings:
#   1. Settings → General → Pull Requests → "Allow auto-merge" enabled.
#   2. Settings → Rules → the `main` ruleset requires the `ci-success` status
#      check. The `ci-success` job in ci.yml reports it.

on: pull_request

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # The actor check stops a person who pushes to a Dependabot branch from
    # getting the bot's approval for their commit.
    if: >-
      ${{
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.actor == 'dependabot[bot]'
      }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        # `GITHUB_TOKEN` cannot read Dependabot alerts, so `ghsa-id` stays empty
        # without this token. It is a fine-grained PAT with only "Dependabot
        # alerts: read", stored as a Dependabot secret.
        with:
          alert-lookup: true
          github-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}

      - name: Check the auto-merge policy
        id: policy
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          GHSA_ID: ${{ steps.meta.outputs.ghsa-id }}
          DEPENDENCY_TYPE: ${{ steps.meta.outputs.dependency-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          eligible=false
          if [[ "$ECOSYSTEM" == "github_actions" ]]; then
            first_party=true
            IFS=',' read -ra names <<< "$DEPENDENCY_NAMES"
            for name in "${names[@]}"; do
              name="${name// /}"
              case "$name" in
                actions/* | github/* | dependabot/*) ;;
                *) first_party=false ;;
              esac
            done
            if [[ "$first_party" == "true" && "$UPDATE_TYPE" != "version-update:semver-major" ]]; then
              eligible=true
            fi
          elif [[ "$UPDATE_TYPE" == "version-update:semver-patch" ]]; then
            eligible=true
          elif [[ -n "$GHSA_ID" && "$UPDATE_TYPE" != "version-update:semver-major" ]]; then
            eligible=true
          elif [[ "$UPDATE_TYPE" == "version-update:semver-minor" && "$DEPENDENCY_TYPE" == "direct:development" ]]; then
            eligible=true
          fi
          echo "Ecosystem: $ECOSYSTEM; update: $UPDATE_TYPE; eligible: $eligible"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      # There is no approval step. The repository does not let GitHub Actions
      # approve pull requests, and the `main` ruleset requires checks, not
      # approvals.
      - name: Enable auto-merge
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
