name: Deploy Demo

on:
  push:
    branches:
      - main
    paths:
      - 'apps/demo/**'
      - 'packages/toolkit/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          filter: tree:0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Nx Cloud access
        env:
          NX_CLOUD_ACCESS_TOKEN_RW: ${{ secrets.NX_CLOUD_ACCESS_TOKEN_RW }}
          NX_CLOUD_ACCESS_TOKEN_RO: ${{ secrets.NX_CLOUD_ACCESS_TOKEN_RO }}
        run: |
          TOKEN=""
          if [ -n "$NX_CLOUD_ACCESS_TOKEN_RW" ]; then
            TOKEN="$NX_CLOUD_ACCESS_TOKEN_RW"
          elif [ -n "$NX_CLOUD_ACCESS_TOKEN_RO" ]; then
            TOKEN="$NX_CLOUD_ACCESS_TOKEN_RO"
          fi

          if [ -n "$TOKEN" ]; then
            echo "NX_CLOUD_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "NX_NO_CLOUD=false" >> "$GITHUB_ENV"
          else
            echo "NX_NO_CLOUD=true" >> "$GITHUB_ENV"
            echo "No Nx Cloud token configured. Running without Nx Cloud."
          fi

      - name: Build Demo
        # nx-safe.sh retries locally if Nx Cloud rejects workspace authorization.
        run: bash .github/scripts/nx-safe.sh pnpm exec nx run demo:build --configuration=production --base=/ngx-signal-forms/

      - name: Create 404.html for SPA routing
        run: cp dist/apps/demo/index.html dist/apps/demo/404.html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist/apps/demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
