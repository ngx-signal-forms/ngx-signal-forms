name: Update Snapshots

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which snapshot suites to update'
        required: true
        type: choice
        default: all
        options:
          - all
          - playwright
          - vitest
      playwright_filter:
        description: 'Optional Playwright spec path (empty runs all specs)'
        required: false
        type: string

permissions: {}

concurrency:
  group: update-snapshots-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  update:
    # Runs the dispatched branch's install scripts, git hooks and tests, which
    # may come from a bot or a contributor. It gets a read-only token and hands
    # the snapshot changes to the `push` job as a patch.
    #
    # Only allow regenerating snapshots on feature branches. The default branch
    # is blocked outright, and long-lived release/beta/rc/production refs are
    # allowlisted out so a dispatched run can never auto-push to them. A run
    # dispatched on a tag is refused, so it cannot create a branch from it.
    if: >-
      ${{
        github.ref_type == 'branch' &&
        github.ref_name != github.event.repository.default_branch &&
        !startsWith(github.ref_name, 'release/') &&
        !startsWith(github.ref_name, 'beta/') &&
        !startsWith(github.ref_name, 'rc/') &&
        github.ref_name != 'production'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.export.outputs.changed }}

    steps:
      # Pin both jobs to the dispatched commit, so the patch applies to the
      # tree it was made from.
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - name: Install dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Configure Nx Cloud access
        env:
          NX_CLOUD_ACCESS_TOKEN_RW: ${{ secrets['NX_CLOUD_ACCESS_TOKEN_RW'] }}
          NX_CLOUD_ACCESS_TOKEN_RO: ${{ secrets['NX_CLOUD_ACCESS_TOKEN_RO'] }}
        run: |
          TOKEN="$NX_CLOUD_ACCESS_TOKEN_RO"
          if [ -z "$TOKEN" ]; then
            TOKEN="$NX_CLOUD_ACCESS_TOKEN_RW"
          fi

          if [ -n "$TOKEN" ]; then
            echo "NX_CLOUD_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "NX_NO_CLOUD=false" >> "$GITHUB_ENV"
            echo "Nx Cloud enabled for snapshot workflow."
          else
            echo "NX_NO_CLOUD=true" >> "$GITHUB_ENV"
            echo "No Nx Cloud token configured. Running snapshot workflow without Nx Cloud."
          fi

      - name: Update Playwright snapshots
        if: ${{ inputs.scope == 'all' || inputs.scope == 'playwright' }}
        # --skip-nx-cache: e2e is cacheable, but __screenshots__/ isn't in
        # the target's outputs, so a cache hit would silently skip regeneration.
        #
        # `e2e`, not `e2e-ci`: the latter is the Playwright plugin's atomized
        # target and Nx refuses to run it without Nx Agents, which this
        # workspace stopped using in #252.
        env:
          PLAYWRIGHT_FILTER: ${{ inputs.playwright_filter }}
        run: |
          args=()
          if [ -n "$PLAYWRIGHT_FILTER" ]; then
            args+=("$PLAYWRIGHT_FILTER")
          fi
          pnpm exec nx run demo-e2e:e2e --skip-nx-cache -- "${args[@]}" --update-snapshots

      - name: Update Vitest browser screenshots
        if: ${{ inputs.scope == 'all' || inputs.scope == 'vitest' }}
        run: pnpm nx test-browser toolkit -- --update

      - name: Export snapshot changes
        id: export
        run: |
          # Stage only known snapshot directories so stray working-tree changes
          # (install artifacts, generated caches, etc.) can never ride along.
          # Each pathspec is staged independently so missing flavors (e.g. no
          # vitest __snapshots__ yet) don't abort the whole step.
          pathspecs=(
            'apps/demo-e2e/src/__screenshots__'
            'apps/demo-e2e/src/__snapshots__'
            ':(glob)apps/demo-e2e/src/**/*.spec.ts-snapshots'
            ':(glob)packages/toolkit/**/__screenshots__'
            ':(glob)packages/toolkit/**/__snapshots__'
          )
          for pathspec in "${pathspecs[@]}"; do
            if ! add_output=$(git add -A -- "$pathspec" 2>&1); then
              if [[ "$add_output" == *"did not match any files"* ]]; then
                echo "No match for pathspec: $pathspec (skipping)"
              else
                printf 'Failed to stage pathspec: %s\n%s\n' "$pathspec" "$add_output" >&2
                exit 1
              fi
            fi
          done

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot changes to commit."
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/snapshots"
          git diff --cached --binary > "$RUNNER_TEMP/snapshots/snapshots.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload snapshot patch
        if: ${{ steps.export.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: snapshot-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshots/snapshots.patch
          if-no-files-found: error
          retention-days: 1

  # Installs nothing and runs no repository code, so the branch cannot reach
  # the write token. The patch is untrusted, so any path outside the snapshot
  # directories fails the job.
  push:
    needs: update
    if: ${{ needs.update.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          filter: tree:0
          persist-credentials: false

      - name: Download snapshot patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshots

      - name: Commit and push snapshot updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          patch="$RUNNER_TEMP/snapshots/snapshots.patch"

          # Keep in sync with the pathspecs in the `update` job.
          allowed='^(apps/demo-e2e/src/__screenshots__/|apps/demo-e2e/src/__snapshots__/|apps/demo-e2e/src/(.+/)?[^/]+\.spec\.ts-snapshots/|packages/toolkit/(.+/)?__screenshots__/|packages/toolkit/(.+/)?__snapshots__/)'
          git apply --index -- "$patch"
          while IFS= read -r -d '' path; do
            if [[ ! "$path" =~ $allowed ]]; then
              printf 'Refusing a change outside the snapshot directories: %s\n' "$path" >&2
              exit 1
            fi
          done < <(git diff --cached --name-only --no-renames -z)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "test(snapshots): update ${INPUT_SCOPE} baselines"

          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --no-verify origin "HEAD:refs/heads/${TARGET_BRANCH}"

  summary:
    needs: [update, push]
    if: ${{ !cancelled() && needs.update.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summary
        env:
          CHANGED: ${{ needs.update.outputs.changed }}
          PUSH_RESULT: ${{ needs.push.result }}
          INPUT_SCOPE: ${{ inputs.scope }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$CHANGED" == "true" && "$PUSH_RESULT" == "success" ]]; then
            {
              echo "### Snapshot baselines updated"
              echo "- Scope: $INPUT_SCOPE"
              echo "- Branch: $TARGET_BRANCH"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$CHANGED" == "true" ]]; then
            echo "### Snapshot changes found, but the push job did not succeed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No snapshot changes detected" >> "$GITHUB_STEP_SUMMARY"
          fi
