name: PR Title

# Squash merges use the PR title as the commit subject, so this checks it
# against the same commitlint rules the commit-msg hook enforces locally
# (see commitlint.config.cjs): Conventional Commits, plus every `@word`
# backticked so GitHub does not render it as a mention (AGENTS.md).
#
# Dependabot titles (e.g. `build(deps): bump @ng-icons/core from 1 to 2`)
# contain a bare `@word` by construction - Dependabot cannot backtick it.
# `build` commits already have `changelog: false` in nx.json, and
# tools/release/project-changelog-renderer.ts escapes a bare `@word` in the
# change-list and breaking-change lines it renders as a second guard. So
# Dependabot PRs are exempt here rather than blocked, matching
# dependabot-auto-merge.yml.
#
# Uses `pull_request` (not `pull_request_target`): no secrets, read-only
# permissions. The title is passed through an env var, never interpolated
# into `run:`.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the base branch's own SHA, not the default merge ref.
      # `pull_request`'s default checkout is the PR's merge commit, which
      # includes the PR's own changes - a PR could edit
      # commitlint.config.cjs, the no-bare-mention rule, or the lockfile to
      # loosen the very check running against it. The base SHA is the last
      # commit on the target branch before this PR, so the check always
      # runs the trusted, already-reviewed rules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          filter: tree:0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
