name: PR Title

# Squash merges use the PR title as the commit subject, so this checks it
# against the same commitlint rules the commit-msg hook enforces locally
# (see commitlint.config.cjs): Conventional Commits, plus every `@word`
# backticked so GitHub does not render it as a mention (AGENTS.md).
#
# Dependabot titles (e.g. `build(deps): bump @ng-icons/core from 1 to 2`)
# contain a bare `@word` by construction - Dependabot cannot backtick it.
# `build` commits already have `changelog: false` in nx.json, and
# tools/release/project-changelog-renderer.ts escapes a bare `@word` in the
# change-list and breaking-change lines it renders as a second guard. So
# Dependabot PRs are exempt here rather than blocked, matching
# dependabot-auto-merge.yml.
#
# Uses `pull_request_target`, not `pull_request`: with `pull_request`,
# GitHub runs the WORKFLOW DEFINITION from the PR's own merge ref, so a PR
# could edit this file itself into a no-op - the base-SHA checkout below
# only protects the commitlint config and rule, not the workflow that runs
# them. `pull_request_target` runs the workflow definition from the base
# branch instead, so a PR cannot disarm its own title check.
#
# This is only safe because the job never checks out or executes PR head
# code: the checkout below is pinned to the base SHA (which
# `actions/checkout` defaults to under `pull_request_target` regardless,
# but pinning it explicitly keeps the intent obvious and matches the
# `pull_request` behavior this replaced), install uses `--ignore-scripts`
# so a base-branch `package.json` cannot run arbitrary lifecycle scripts,
# the PR title is passed through `env` and never interpolated into `run:`,
# `persist-credentials` stays `false`, and `permissions` grants only
# `contents: read` - no secrets, no write access. See GitHub's guidance on
# securely using `pull_request_target`:
# https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
#
# Heads-up: `pull_request_target` workflows run using the workflow file
# version on the BASE branch, not the PR branch. Until this file is merged
# to main, it does not exist there yet, so this check will not run on the
# PR that introduces it (including #549 itself). Expected - it starts
# running on the next PR opened after this one merges.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pin the checkout to the base SHA (see the top-of-file note on
      # `pull_request_target` safety) - never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          filter: tree:0
          persist-credentials: false

      # Bootstrap guard: on the PR that first adds commitlint.config.cjs
      # (and on any older PR opened before it lands on main), the base SHA
      # above has no commitlint config and no commitlint devDependency, so
      # installing and linting would fail or error rather than just report
      # nothing to check. Skip cleanly instead. This step becomes dead
      # once that PR merges to main - every base SHA has the config from
      # then on - but it costs nothing to leave in as a standing guard.
      - name: Check for commitlint config on the base branch
        id: config
        run: |
          if [ -f commitlint.config.cjs ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Base branch has no commitlint.config.cjs yet, so the PR-title check is skipped for this PR."
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        name: Install pnpm
        if: steps.config.outputs.exists == 'true'
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.config.outputs.exists == 'true'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.config.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint PR title
        if: steps.config.outputs.exists == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
